# Локальная проверка 3 сервисов (БД и S3 — внешние, управляемые TimeWeb).
services:
  orders-webhook:
    build:
      context: .
      dockerfile: docker/Dockerfile.webhook
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GSHEETS_SECRET: ${GSHEETS_SECRET}
      POSTBOX_KEY_ID: ${POSTBOX_KEY_ID}
      POSTBOX_SECRET: ${POSTBOX_SECRET}
      POSTBOX_REGION: ${POSTBOX_REGION:-ru-central1}
    ports:
      - "8080:8080"

  calls-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8081:8081"

  crm:
    build:
      context: .
      dockerfile: docker/Dockerfile.crm
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - "8082:8080"
