# Автосборка образа приложения и его доставка в Timeweb App Platform.
#
# Как работает:
#   1. при пуше в main (или вручную) GitHub собирает образ из корневого Dockerfile;
#   2. загружает его в Docker Hub (amkorobov/zc-web) — App Platform умеет забирать
#      готовые образы только оттуда и только открытые. Секретов в образе нет
#      (пароли и ключи живут в переменных приложения в панели), поэтому открытый
#      образ безопасен;
#   3. если заданы секреты TIMEWEB_API_TOKEN и TIMEWEB_APP_ID — дёргает Timeweb:
#      «запусти деплой приложения», и оно подтягивает свежую версию само.
#
# Почему не сборка на стороне Timeweb: при сборке приложения из репозитория
# платформа теряла 20–50% входящих соединений (проверено 22.09.2026: 16/20 и 24/30
# против 30/30 на готовом образе). Поэтому приложение работает в режиме
# «готовый образ» (custom-image) — Timeweb ничего не собирает, только запускает.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — логин Docker Hub (amkorobov)
#   DOCKERHUB_TOKEN    — токен Docker Hub с правом Read & Write
#   TIMEWEB_API_TOKEN  — токен Timeweb Cloud            (необязательно)
#   TIMEWEB_APP_ID     — id приложения в App Platform   (необязательно)
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Образ в Docker Hub. Имена — только в нижнем регистре.
  IMAGE: amkorobov/zc-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Включить сборку расширенных образов
        uses: docker/setup-buildx-action@v3

      - name: Войти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Собрать и загрузить образ
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Строго одна платформа и без аттестаций: лишние записи в манифесте
          # («unknown/unknown») сбивают проверку тега в панели Timeweb.
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Сообщить Timeweb о новой версии
        continue-on-error: true
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          TIMEWEB_APP_ID: ${{ secrets.TIMEWEB_APP_ID }}
        run: |
          if [ -z "${TIMEWEB_API_TOKEN}" ] || [ -z "${TIMEWEB_APP_ID}" ]; then
            echo "Секреты Timeweb не заданы — шаг пропущен."
            exit 0
          fi
          curl -sS -X POST "https://api.timeweb.cloud/api/v1/apps/${TIMEWEB_APP_ID}/deploy" \
            -H "Authorization: Bearer ${TIMEWEB_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}'
