# Прод-стек 13.0 для Timeweb App Platform (деплой из этого репозитория).
#
# Правило платформы: публичный домен получает ПЕРВЫЙ сервис файла, поэтому
# `app` (CRM + приём данных) стоит первым. `worker` наружу не публикуется —
# ему нужен только исходящий доступ (IMAP и S3).
#
# Значения ${VAR:-default} берутся из переменных приложения App Platform;
# если переменная не задана, подставляется разумное значение по умолчанию
# (иначе compose передаёт пустую строку и сервис падает на int('')).
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.twcstorage.ru}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      CALL_TIMEZONE_OFFSET: ${CALL_TIMEZONE_OFFSET:-+03:00}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GSHEETS_SECRET: ${GSHEETS_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.twcstorage.ru}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      CALL_TIMEZONE_OFFSET: ${CALL_TIMEZONE_OFFSET:-+03:00}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.yandex.ru}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      PARSER_LOOKBACK_HOURS: ${PARSER_LOOKBACK_HOURS:-24}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-300}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8081}
