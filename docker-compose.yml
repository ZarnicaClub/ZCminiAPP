# Прод-стек для Timeweb App Platform.
#
# ВАЖНО: в этом файле остаётся ТОЛЬКО один сервис — `app` (CRM + приём данных).
# Воркер разбора звонков вынесен на отдельный сервер (см. docker-compose.worker.yml
# и docs/vps-worker.md): пока он был вторым контейнером этого стека, платформа
# теряла часть входящих соединений к веб-приложению.
#
# Значения ${VAR:-default} берутся из переменных приложения App Platform;
# если переменная не задана, подставляется разумное значение по умолчанию
# (иначе compose передаёт пустую строку и сервис падает на int('')).
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.twcstorage.ru}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      CALL_TIMEZONE_OFFSET: ${CALL_TIMEZONE_OFFSET:-+03:00}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GSHEETS_SECRET: ${GSHEETS_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8080:8080"
