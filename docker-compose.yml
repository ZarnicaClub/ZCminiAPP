# Прод-стек 13.0 для Timeweb App Platform (деплой из этого репозитория).
#
# Правило платформы: публичный домен получает ПЕРВЫЙ сервис файла, поэтому
# `app` (CRM + приём данных) стоит первым. `worker` наружу не публикуется —
# ему нужен только исходящий доступ (IMAP и S3).
#
# Значения ${...} берутся из переменных приложения App Platform.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      CALL_TIMEZONE_OFFSET: ${CALL_TIMEZONE_OFFSET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GSHEETS_SECRET: ${GSHEETS_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      CALL_TIMEZONE_OFFSET: ${CALL_TIMEZONE_OFFSET}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FOLDER: ${MAIL_FOLDER}
      PARSER_LOOKBACK_HOURS: ${PARSER_LOOKBACK_HOURS}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT}
